name: mi_ruta
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.4.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  get_it: ^9.2.1
  equatable: ^2.0.8
  google_maps_flutter: ^2.17.0
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  http: ^1.4.0
  image_picker: ^1.0.4
  path_provider: ^2.1.5
  mobile_scanner: ^5.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.1
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/cochabamba_gtfs/routes.txt
    - assets/cochabamba_gtfs/trips.txt
    - assets/cochabamba_gtfs/shapes.txt
    - assets/cochabamba_gtfs/stops.txt
    - assets/cochabamba_gtfs/stop_times.txt
    - assets/cochabamba_gtfs/frequencies.txt
    - assets/cochabamba_gtfs/calendar.txt

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"